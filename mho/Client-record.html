<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Record - Astral Sanctuary</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            /* Ilustrasi Dunia Magik / Hutan Bercahaya Alam Lain */
            background: linear-gradient(rgba(4, 22, 28, 0.55), rgba(8, 16, 36, 0.78)),
                        url('https://unsplash.com') no-repeat center center/cover;
            color: #ffffff;
        }

        /* Animasi Zarah Magik (Fireflies) */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #2dd4bf;
            border-radius: 50%;
            box-shadow: 0 0 12px #99f6e4, 0 0 24px #14b8a6;
            animation: floatUp 10s infinite ease-in-out;
            opacity: 0;
        }

        .particle:nth-child(1) { left: 18%; animation-duration: 9s; animation-delay: 0s; background: #fbbf24; box-shadow: 0 0 12px #fde68a; }
        .particle:nth-child(2) { left: 35%; animation-duration: 12s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 55%; animation-duration: 8.5s; animation-delay: 4s; background: #38bdf8; box-shadow: 0 0 12px #bae6fd; }
        .particle:nth-child(4) { left: 72%; animation-duration: 11s; animation-delay: 1s; background: #fbbf24; box-shadow: 0 0 12px #fde68a; }
        .particle:nth-child(5) { left: 88%; animation-duration: 10s; animation-delay: 3s; }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Kad Portal Glassmorphism */
        .portal-card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 420px;
            padding: 45px 35px;
            border-radius: 24px;
            background: rgba(10, 28, 36, 0.48);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(45, 212, 191, 0.35);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.65), inset 0 0 25px rgba(20, 184, 166, 0.15);
            text-align: center;
        }

        .realm-badge {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #5eead4;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ccfbf1, #2dd4bf, #fcd34d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 0.88rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 22px;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(45, 212, 191, 0.45);
            background: rgba(5, 16, 24, 0.65);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="password"]::placeholder {
            letter-spacing: 1px;
            color: rgba(203, 213, 225, 0.5);
            font-size: 0.9rem;
        }

        input[type="password"]:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 18px rgba(45, 212, 191, 0.5);
        }

        /* Butang Utama */
        .magic-btn {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: #ffffff;
            background: linear-gradient(135deg, #0d9488, #2563eb);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(13, 148, 136, 0.6);
            transition: all 0.35s ease;
        }

        .magic-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #14b8a6, #1d4ed8);
            box-shadow: 0 0 30px rgba(45, 212, 191, 0.85);
        }

        .magic-btn:active {
            transform: translateY(1px);
        }

        #status-msg {
            margin-top: 16px;
            font-size: 0.85rem;
            min-height: 20px;
            color: #5eead4;
        }
    </style>
</head>
<body>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="portal-card">
        <span class="realm-badge">✦ Astral Vault ✦</span>
        <h1>Client Record</h1>
        <p>Ruang simpanan rahsia klien merentasi dimensi. Masukkan kata laluan untuk masuk.</p>

        <form onsubmit="unlockPortal(event)">
            <div class="input-group">
                <input type="password" id="passInput" placeholder="••••••••" required>
            </div>
            <button type="submit" class="magic-btn">Enter your Password</button>
        </form>

        <div id="status-msg"></div>
    </div>

    <script>
        function unlockPortal(e) {
            e.preventDefault();
            const pass = document.getElementById('passInput').value;
            const msg = document.getElementById('status-msg');
            if(pass.trim() !== "") {
                msg.textContent = "✨ Kunci dimensi sah! Membuka Client Record...";
            }
        }
    </script>

</body>
</html>
